name: Site policy compatibility
on:
  push:
    branches: [fix-site-policy, merge-upstream-20261117, fix-browser-capability-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classification, privacy and failure handling
        working-directory: crates/claude-local/runtime
        run: node --test --test-timeout=30000 site-policy.test.mjs browser-site-consent.test.mjs
      - name: Native HTTPS route and runtime packaging
        working-directory: crates/claude-local/runtime
        run: |
          bash scripts/gen-ca.sh
          node --test --test-timeout=120000 managed.test.mjs proxy.test.mjs desktop-ui.test.mjs ui-resources.test.mjs scripts/*.test.mjs
      - name: Frontend settings contract
        if: ${{ !cancelled() }}
        working-directory: apps/claude-mom
        run: |
          npm ci
          npm run check
          npm test
          npm run vite:build
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !cancelled() }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !cancelled() }}
      - name: Settings persistence and runtime packaging
        if: ${{ !cancelled() }}
        run: cargo test -p claude-local
