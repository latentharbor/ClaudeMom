name: Frontend reload audit
on:
  push:
    branches: [audit-hot-reload-20261117, feature-durable-runtime-20261117]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reload-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-reload:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CLAUDE_MOM_LAB_BUILD: '1'
      VITE_CLAUDE_MOM_LAB_BUILD: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/claude-mom/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Inspection syntax and certificate boundary
        run: |
          node --check scripts/verify-ui-lab.mjs
          node --check scripts/ui-lab-bootstrap.cjs
          node --test scripts/lab-certificate-policy.test.cjs
      - name: Build isolated manager only
        working-directory: apps/claude-mom
        run: |
          npm ci
          npm run check
          npm test
          npm run tauri -- build --bundles app --config src-tauri/tauri.lab.conf.json
      - name: Package isolated manager for review
        run: |
          codesign --verify --deep --strict 'target/release/bundle/macos/ClaudeMom UI Lab.app'
          mkdir -p isolated-manager-artifacts
          ditto -c -k --keepParent 'target/release/bundle/macos/ClaudeMom UI Lab.app' isolated-manager-artifacts/ClaudeMom-Hot-Reload-Lab.zip
          (cd isolated-manager-artifacts && shasum -a 256 ClaudeMom-Hot-Reload-Lab.zip > SHA256SUMS)
      - name: Runtime ownership, hot configuration and compatibility contracts
        working-directory: crates/claude-local/runtime
        run: |
          bash scripts/gen-ca.sh
          node --test --test-timeout=120000 hot-runtime.test.mjs runtime-bridge.test.mjs local-policy.test.mjs service.test.mjs browser-site-consent.test.mjs site-policy.test.mjs managed.test.mjs proxy.test.mjs desktop-ui.test.mjs ui-resources.test.mjs scripts/*.test.mjs
      - name: Rust lifecycle and isolation contracts
        run: cargo test --workspace
      - name: Prepare owned Desktop fixture
        run: |
          test "$(uname -m)" = arm64
          mkdir -p fixture reload-evidence
          gh release download lab-fixtures-5.11492.5 -R "$GITHUB_REPOSITORY" --dir fixture
          (cd fixture && shasum -a 256 -c SHA256SUMS)
          ditto -x -k fixture/Claude-5.11492.5.zip fixture
          ditto -x -k fixture/cli-cache-2.1.325.zip fixture
          mkdir -p fixture/overlay
          gh release download reload-fixtures-5.11492.5-20261117 -R "$GITHUB_REPOSITORY" --dir fixture/overlay
          (cd fixture/overlay && shasum -a 256 -c SHA256SUMS)
          cp fixture/overlay/desktop-features.json fixture/desktop-features.json
          ditto -x -k fixture/overlay/web-cache.zip fixture
          codesign --verify --deep --strict fixture/Claude.app
          cd crates/claude-local/runtime
          bash scripts/gen-ca.sh
          sudo security add-trusted-cert -d -r trustRoot -p ssl -k /Library/Keychains/System.keychain ca/ca.pem
      - name: Observe frontend reload during fixture tasks
        run: |
          node scripts/verify-ui-lab.mjs \
            "$PWD/target/release/bundle/macos/ClaudeMom UI Lab.app" \
            "$PWD/fixture/Claude.app" \
            "$PWD/fixture/desktop-features.json" \
            "$PWD/crates/claude-local/runtime/ca" \
            "$PWD/fixture/cli-cache" \
            "$PWD/reload-evidence" \
            "$PWD/fixture/web-cache" --probe-reload --probe-service
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frontend-reload-evidence
          path: reload-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Isolated-hot-reload-manager
          path: isolated-manager-artifacts/
          if-no-files-found: error
