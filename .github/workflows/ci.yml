# 每次推送 main：macOS / Windows 上跑测试并完整编一遍（不打包、不发布），发版前先把平台问题暴露出来。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/claude-mom/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 前端：类型检查、测试、构建
        working-directory: apps/claude-mom
        run: |
          npm ci
          npm run check
          npm test
          npm run vite:build

      - name: Rust 测试
        run: cargo test --workspace

      - name: 本地兼容服务（Node）测试
        if: runner.os == 'macOS'
        working-directory: crates/claude-local/runtime
        run: |
          bash scripts/gen-ca.sh
          node --test --test-timeout=120000 hot-runtime.test.mjs runtime-bridge.test.mjs local-policy.test.mjs service.test.mjs browser-site-consent.test.mjs site-policy.test.mjs managed.test.mjs proxy.test.mjs desktop-ui.test.mjs ui-resources.test.mjs projects-cli.test.mjs projects-local.test.mjs projects-engine.test.mjs projects-protocol.test.mjs projects-migration.test.mjs projects-sandbox.test.mjs projects-broker.test.mjs projects-network.test.mjs scripts/*.test.mjs

      - name: release 编译
        run: cargo build --release -p claude-mom
