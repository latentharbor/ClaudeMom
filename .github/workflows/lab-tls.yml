name: Lab certificate policy
on:
  push:
    branches: [lab-tls-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/lab-certificate-policy.test.cjs
      - name: UI profile and matched resource contracts
        working-directory: crates/claude-local/runtime
        run: node --test desktop-ui.test.mjs ui-resources.test.mjs
